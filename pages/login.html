<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesión</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<main class="contenedor">

    <header class="logo">
        <img src="../assets/img/logo.png" alt="Logo SportClub">
    </header>

    <section class="login-card">

        <h1>Inicio Sesión</h1>

        <form id="loginForm" novalidate>

            <div class="grupo-input">
                <label for="correo">Correo Electrónico</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                >
                <span class="error-msg" id="err-correo"></span>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                >
                <span class="error-msg" id="err-password"></span>
            </div>

            <div id="mensajeError"></div>

            <button type="submit" id="btnLogin">
                Ingresar
            </button>

        </form>

        <nav class="links">
            <a href="./recuperacion.html">¿Olvidaste tu contraseña?</a>
            <a href="./registro.html">Registrarse</a>
        </nav>

    </section>

</main>

<script>

const formulario = document.getElementById("loginForm");

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    // Limpiar errores anteriores
    limpiarErrores();

    const email    = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value;
    const mensajeError = document.getElementById("mensajeError");
    const btnLogin = document.getElementById("btnLogin");

    // ── Validaciones visuales ──────────────────────────────
    let valido = true;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email) {
        mostrarError("correo", "err-correo", "El correo es obligatorio");
        valido = false;
    } else if (!emailRegex.test(email)) {
        mostrarError("correo", "err-correo", "Formato de correo inválido");
        valido = false;
    }

    if (!password) {
        mostrarError("password", "err-password", "La contraseña es obligatoria");
        valido = false;
    }

    if (!valido) return;

    // ── Llamada a la API ───────────────────────────────────
    btnLogin.textContent = "Ingresando...";
    btnLogin.disabled = true;

    try {

        const respuesta = await fetch("https://frontend-backend-clubdeportivo.onrender.com/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const resultado = await respuesta.json();
        console.log(resultado);

        if (resultado.ok) {

            // Guardar token y datos del usuario
            localStorage.setItem("token", resultado.data.token);
            localStorage.setItem("usuario", JSON.stringify(resultado.data.user));

            mensajeError.style.color = "#27ae60";
            mensajeError.textContent = "✅ Login correcto, redirigiendo...";

            // ── Redirección según rol ──────────────────────
            const rol = resultado.data.user.role;

            setTimeout(() => {
                if (rol === "admin") {
                    window.location.href = "./dashboard_admin.html";
                } else if (rol === "coach") {
                    window.location.href = "./dashboard_coach.html";
                } else {
                    window.location.href = "./dashboard_usuario.html";
                }
            }, 800);

        } else {

            mensajeError.style.color = "#e74c3c";
            mensajeError.textContent = resultado.message || "Credenciales incorrectas";

            btnLogin.textContent = "Ingresar";
            btnLogin.disabled = false;
        }

    } catch (error) {

        console.error(error);
        mensajeError.style.color = "#e74c3c";
        mensajeError.textContent = "❌ Error de conexión con el servidor";

        btnLogin.textContent = "Ingresar";
        btnLogin.disabled = false;
    }

});

// ── Helpers ────────────────────────────────────────────────

function mostrarError(inputId, errorId, mensaje) {
    const input = document.getElementById(inputId);
    const error = document.getElementById(errorId);
    if (input) input.style.borderColor = "#e74c3c";
    if (error) error.textContent = mensaje;
}

function limpiarErrores() {
    ["correo", "password"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.borderColor = "";
    });
    ["err-correo", "err-password"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = "";
    });
    const msg = document.getElementById("mensajeError");
    if (msg) msg.textContent = "";
}

</script>
</body>
</html>
